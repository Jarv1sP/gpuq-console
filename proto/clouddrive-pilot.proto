// Wire-compatible subset of the official CloudDrive2 v1.1.1 API.
// Source: https://www.clouddrive2.com/api/clouddrive.proto (2026-10-03).
// Deliberately omits account browsing, deletion, mounts and file-byte RPCs.
syntax = "proto3";
package clouddrive;
service CloudDriveFileSrv {
  rpc GetToken(GetTokenRequest) returns (JWTToken) {}
  rpc FindFileByPath(FindFileByPathRequest) returns (CloudDriveFile) {}
  rpc CreateFolder(CreateFolderRequest) returns (CreateFolderResult) {}
  rpc AddSharedLink(AddSharedLinkRequest) returns (Empty) {}
  rpc GetSubFiles(ListSubFileRequest) returns (stream SubFilesReply) {}
  rpc GetDownloadUrlPath(GetDownloadUrlPathRequest) returns (DownloadUrlPathInfo) {}
}
message Empty {}
message Timestamp { int64 seconds = 1; int32 nanos = 2; }
message GetTokenRequest { string userName = 1; string password = 2; optional string totpCode = 3; }
message JWTToken { bool success = 1; string errorMessage = 2; string token = 3; Timestamp expiration = 4; }
message FindFileByPathRequest { string parentPath = 1; string path = 2; }
message CreateFolderRequest { string parentPath = 1; string folderName = 2; }
message FileOperationResult { bool success = 1; string errorMessage = 2; repeated string resultFilePaths = 3; }
message CreateFolderResult { CloudDriveFile folderCreated = 1; FileOperationResult result = 2; }
message AddSharedLinkRequest { string sharedLinkUrl = 1; optional string sharedPassword = 2; string toFolder = 3; }
message ListSubFileRequest { string path = 1; bool forceRefresh = 2; optional bool checkExpires = 3; }
message SubFilesReply { repeated CloudDriveFile subFiles = 1; }
message CloudAPI {
  string name = 1; string userName = 2; bool isLocked = 4;
  optional string path = 10; bool readOnly = 12;
}
message CloudDriveFile {
  string id = 1; string name = 2; string fullPathName = 3; int64 size = 4;
  enum FileType { Directory = 0; File = 1; Other = 2; }
  FileType fileType = 5; CloudAPI CloudAPI = 9;
  bool isDirectory = 30; bool isRoot = 31; bool isCloudRoot = 32;
  bool isCloudDirectory = 33; bool isCloudFile = 34; bool isSearchResult = 35;
  bool isForbidden = 36; bool isLocal = 37; bool canAddShareLink = 67;
  map<uint32, string> fileHashes = 70; bool readOnly = 80;
}
message GetDownloadUrlPathRequest {
  string path = 1; bool preview = 2; bool lazy_read = 3; bool get_direct_url = 4;
}
message DownloadUrlPathInfo {
  string downloadUrlPath = 1; optional uint64 expiresIn = 2;
  optional string directUrl = 3; optional string userAgent = 4;
  map<string, string> additionalHeaders = 5;
}
