services:
  gpuq-console:
    build: {context: ., dockerfile: deploy/Dockerfile}
    image: gpuq-console:local
    container_name: gpuq-console
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    environment:
      NODE_ENV: production
      PUBLIC_ORIGIN: https://${PORTAL_DOMAIN:?Run scripts/configure.mjs first}
      DATABASE_PATH: /data/portal.sqlite
      BOOTSTRAP_FILE: /data/bootstrap.json
      GPUQ_STATUS_PATH: /status/snapshot.json
      EXECUTOR_SOCKET: /executor/bridge.sock
    volumes: ["./data:/data", "./status:/status:ro", "/run/gpuq-console-executor:/executor:ro"]
    networks: [backend]
    logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?Run scripts/configure.mjs first}
      HEADSCALE_DOMAIN: ${HEADSCALE_DOMAIN:?Run scripts/configure.mjs first}
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    networks: [backend, edge]
  headscale:
    profiles: [headscale]
    image: headscale/headscale:0.29.3
    command: serve
    restart: unless-stopped
    volumes: ["./generated/headscale.yaml:/etc/headscale/config.yaml:ro", "./deploy/policy.hujson:/etc/headscale/policy.hujson:ro", "headscale_data:/var/lib/headscale"]
    networks: [backend, edge]
networks:
  backend: {internal: true}
  edge: {}
volumes:
  caddy_data: {}
  caddy_config: {}
  headscale_data: {}
