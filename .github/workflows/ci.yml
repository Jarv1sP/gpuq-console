name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:python
      - run: npx playwright install --with-deps chromium
      - run: node tests/ui-smoke.mjs
      - run: python3 scripts/build-gpuq.py
      - run: python3 build/gpuq.pyz --help
      - run: python3 -m compileall -q deploy gpuq scripts
      - run: git diff --check
      - run: docker build -f deploy/Dockerfile -t gpuq-console:ci .
      - run: python3 scripts/check-public-tree.py
