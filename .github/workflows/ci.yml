name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:python
      - run: npx playwright install --with-deps chromium
      - run: node tests/ui-smoke.mjs
      - run: node tests/datasets-ui-smoke.mjs
      - run: node tests/dataset-upload-ui-smoke.mjs
      - run: node tests/projects-ui-smoke.mjs
      - run: node tests/priority-ui-smoke.mjs
      - run: node tests/community-ui-smoke.mjs
      - run: node tests/guide-ui-smoke.mjs
      - run: node tests/ui-polish-smoke.mjs
      - run: node tests/job-diagnostics-ui-smoke.mjs
      - run: node tests/client-auth-smoke.mjs
      - run: python3 scripts/build-gpuq.py
      - run: python3 build/gpuq.pyz --help
      - run: python3 -m compileall -q deploy gpuq scripts
      - run: git diff --check
      - run: docker build -f deploy/Dockerfile -t gpuq-console:ci .
      - run: python3 scripts/check-public-tree.py
  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node --test tests/install-client-windows.test.js tests/cli-native-platform.test.js tests/dataset-file-identity.test.js tests/dataset-upload-cli.test.js
